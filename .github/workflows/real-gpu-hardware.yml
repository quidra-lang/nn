name: real-gpu-hardware

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Hardware backend to validate
        required: true
        default: nvidia
        type: choice
        options:
          - nvidia
          - nvidia-multi
          - amd
          - all
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/real-gpu-hardware.yml"
      - "main.qui"
      - "internal.qui"
      - "mode.qui"
      - "runtime.qui"
      - "native.qui"
      - "native/**"
      - "project.toml"
      - "quidra.package"
      - "tests/real_gpu_integration.sh"
      - "nvidia/**"
      - "scripts/materialize_nvidia_bundle.py"

concurrency:
  group: nn-real-gpu-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvidia:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'nvidia' || inputs.backend == 'all')) ||
      (github.event_name == 'push' && vars.QUIDRA_NVIDIA_GPU_CI == '1')
    runs-on: [self-hosted, linux, x64, quidra-nvidia]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - name: Expose Math as sibling package
        run: ln -s "${GITHUB_WORKSPACE}/math" "$(dirname "${GITHUB_WORKSPACE}")/math"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang llvm libcurl4-openssl-dev
      - name: Build Quidra
        run: cmake -S quidra -B quidra/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON && cmake --build quidra/build --parallel
      - name: Materialize pinned NVIDIA NN bundle
        run: |
          python3 scripts/materialize_nvidia_bundle.py --platform linux-x86_64 --output "$RUNNER_TEMP/nn-bundle"
          python3 tests/validate_nvidia_bundle.py --require-populated "$RUNNER_TEMP/nn-bundle"
      - name: Require NVIDIA hardware and run NN numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "NVIDIA"
          QUIDRA_NN_NVIDIA_LIBRARY_PATH: ${{ runner.temp }}/nn-bundle/nvidia/lib
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"

  nvidia-multi:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'nvidia-multi' || inputs.backend == 'all')) ||
      (github.event_name == 'push' && vars.QUIDRA_NVIDIA_MULTI_GPU_CI == '1')
    runs-on: [self-hosted, linux, x64, quidra-nvidia-multi]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - name: Expose Math as sibling package
        run: ln -s "${GITHUB_WORKSPACE}/math" "$(dirname "${GITHUB_WORKSPACE}")/math"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang llvm libcurl4-openssl-dev
      - name: Build Quidra
        run: cmake -S quidra -B quidra/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON && cmake --build quidra/build --parallel
      - name: Materialize pinned NVIDIA NN bundle
        run: |
          python3 scripts/materialize_nvidia_bundle.py --platform linux-x86_64 --output "$RUNNER_TEMP/nn-bundle"
          python3 tests/validate_nvidia_bundle.py --require-populated "$RUNNER_TEMP/nn-bundle"
      - name: Require two NVIDIA GPUs and run NCCL integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "NVIDIA"
          QUIDRA_REQUIRE_MULTI_GPU: "1"
          QUIDRA_NN_NVIDIA_LIBRARY_PATH: ${{ runner.temp }}/nn-bundle/nvidia/lib
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"

  amd:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'amd' || inputs.backend == 'all')) ||
      (github.event_name == 'push' && vars.QUIDRA_AMD_GPU_CI == '1')
    runs-on: [self-hosted, linux, x64, quidra-amd]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: develop
          path: quidra
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/math
          ref: develop
          path: math
      - name: Expose Math as sibling package
        run: ln -s "${GITHUB_WORKSPACE}/math" "$(dirname "${GITHUB_WORKSPACE}")/math"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang llvm libcurl4-openssl-dev
      - name: Build Quidra
        run: cmake -S quidra -B quidra/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON && cmake --build quidra/build --parallel
      - name: Require AMD hardware and run NN numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "AMD"
        run: bash tests/real_gpu_integration.sh "$GITHUB_WORKSPACE/quidra/build/quidra"
